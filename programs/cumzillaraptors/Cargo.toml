[package]
name = "cumzillaraptors"
version = "0.1.0"
description = "Cumzillaraptor NFT Collection — mint + claim"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
solana-program = "~1.18"

[profile.release]
opt-level = "z"
lto = true
debug = false
overflow-checks = true
