[package]
name = "cumzillaraptors"
version = "0.1.0"
description = "Cumzillaraptors devnet sale and claim controller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
# Suppress Solana's incompatible default panic macro under SBPF platform-tools v1.54.
# Release builds retain `panic = "abort"` below.
custom-panic = []
# Deliberately non-default: only the private x86 localhost validation SBPF artifact enables this.
# It must never be used for the ordinary production/devnet artifact.
test-validation = []
# Retargets every hash domain (allocation, claims, metadata, EIP-191 messages) to the
# "mainnet" cluster tag. MUST only be enabled for the mainnet-beta deployment artifact.
mainnet = []
default = ["custom-panic"]

[dependencies]
# mpl-core 0.12.1's `anchor-0-32` feature pins its CPI account types to Anchor 0.32.
anchor-lang = { version = "0.32.1" }
# Disable mpl-core's default borsh-v1 mode and select the matching Anchor integration.
mpl-core = { version = "0.12.1", default-features = false, features = ["anchor-0-32"] }
# Keep the allocation manifest protocol on Solana-compatible Keccak-256, not SHA-256.
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
# In-program secp256k1 recovery for the claim signature. Anchor 0.32's solana_program
# facade does not re-export this, so depend on the split crate directly.
solana-secp256k1-recover = "2.2.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace]
resolver = "2"
