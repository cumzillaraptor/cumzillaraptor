[package]
name = "cumzillaraptors"
version = "0.1.0"
description = "Cumzillaraptors devnet sale and claim controller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }
# 0.7.2 is compatible with Anchor 0.30 and constrains solana-program to >=1.14,<1.19.
# Used for the on-chain CreateCollectionV1 CPI (Task 7) and off-chain instruction building.
mpl-core = { version = "=0.7.2", features = ["anchor"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace]
resolver = "2"
