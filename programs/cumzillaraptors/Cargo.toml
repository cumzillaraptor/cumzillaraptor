[package]
name = "cumzillaraptors"
version = "0.1.0"
description = "Cumzillaraptors devnet sale and claim controller"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
# This controller only uses Anchor's re-export of solana_program; no SPL CPI crates are needed yet.
anchor-lang = { version = "=0.30.1", features = ["init-if-needed"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[workspace]
resolver = "2"
