# Cloudflare Worker (static assets) config for cumzillaraptor.com
name = "cumzillaraptor"
compatibility_date = "2026-08-01"

[assets]
directory = "./dist"

# Subdomain routes — mint/ and claim/ paths remain valid too (same asset bundle).
# DNS: mint + claim records must be proxied (orange cloud) in the cumzillaraptor.com zone.
routes = [
  { pattern = "mint.cumzillaraptor.com", custom_domain = true },
  { pattern = "claim.cumzillaraptor.com", custom_domain = true }
]
