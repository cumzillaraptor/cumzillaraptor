# Cloudflare Worker (static assets) config for cumzillaraptor.com
name = "cumzillaraptor"
compatibility_date = "2026-08-01"

main = "worker.js"

[build]
command = "node scripts/build-site-dist.js"

# Subdomain custom domains. Worker maps their root to /mint/ + /claim/ (see worker.js).
routes = [
  { pattern = "mint.cumzillaraptor.com", custom_domain = true },
  { pattern = "claim.cumzillaraptor.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
