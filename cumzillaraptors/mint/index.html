  <style>
    main {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: clamp(40px, 6vh, 72px) 22px;
    }
    .wrap { width: min(100%, 560px); display: grid; justify-items: center; text-align: center; }
    h1 {
      margin: 0 0 4px;
      color: var(--green);
      font-size: clamp(38px, 7vw, 60px);
      font-weight: 400; line-height: .95; letter-spacing: -.04em;
      text-transform: lowercase;
      text-shadow: 0 2px 0 rgba(0,0,0,.55);
    }
    .tagline { color: var(--muted); font-size: clamp(15px, 2.2vw, 19px); margin: 0 0 22px; }
    .panel { width: 100%; text-align: center; font-family: system-ui, sans-serif; }

    /* ---- progress bar ---- */
    .progress-wrap { margin: 4px 0 14px; }
    .progress-label {
      display: flex; justify-content: space-between;
      color: var(--muted); font-size: 12.5px; margin-bottom: 6px;
    }
    .progress-label strong { color: var(--green); font-weight: 500; }
    .progress-track {
      height: 16px; border-radius: 50px; overflow: hidden;
      background: var(--charcoal);
      border: 1px solid var(--line);
    }
    .progress-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, rgba(109,254,65,.55), var(--green));
      border-radius: 50px;
      transition: width 600ms cubic-bezier(.16,1,.3,1);
      box-shadow: 0 0 12px rgba(109,254,65,.35);
    }

    /* ---- minted raptor portrait ---- */
    .raptor-stage {
      width: 168px; margin: 0 auto 8px;
      border-radius: 16px;
      border: 1px solid var(--line);
      overflow: hidden;
    }
    .raptor-stage img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    .reveal.revealed .raptor-stage { border-color: var(--green); }

    /* ---- slot machine reveal ---- */
    .reveal {
      position: relative;
      min-height: 118px;
      margin: 10px 0 6px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--charcoal);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 12px;
    }
    .reveal .slot-name {
      font-family: "Chewy", system-ui, sans-serif;
      font-size: clamp(26px, 5vw, 38px);
      color: var(--green);
      letter-spacing: -.02em;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(0,0,0,.6);
    }
    .reveal.spinning .slot-name { filter: blur(1.5px); opacity: .85; }
    .reveal .traits {
      margin-top: 8px;
      display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
    }
    .trait-chip {
      padding: 3px 10px;
      border: 1px solid var(--line);
      border-radius: 50px;
      color: var(--ink);
      font-size: 11.5px;
      white-space: nowrap;
    }
    .trait-chip b { color: var(--green); font-weight: 600; }
    @keyframes pop-in {
      0% { transform: scale(.55); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    .reveal.revealed { animation: pop-in 480ms cubic-bezier(.16,1,.3,1) both; border-color: var(--green); box-shadow: 0 0 24px rgba(109,254,65,.18); }

    /* ---- confetti ---- */
    canvas.confetti-canvas {
      position: fixed; inset: 0; z-index: 60;
      pointer-events: none;
    }

    /* ---- status pill (reuses homepage vibe) ---- */
    .status-pill {
      display: inline-block;
      padding: 9px 18px;
      border: 1px solid var(--line);
      border-radius: 50px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13.5px;
      margin-bottom: 14px;
    }
    .status-pill strong { color: var(--green); font-weight: 500; }

    .actions { display: flex; gap: 12px; justify-content: center; margin-top: 16px; }
    button.action-btn { font-family: "Chewy", system-ui, sans-serif; letter-spacing: .02em; }
    .msg { min-height: 20px; font-size: 13.5px; margin-top: 12px; word-break: break-all; }
    .msg.ok { color: var(--green); }
    .msg.err { color: #ff7a7a; }
    a.explorer { color: var(--green); }
    .fineprint { color: var(--muted); font-size: 12px; max-width: 430px; line-height: 1.55; margin-top: 12px; }
    @media (prefers-reduced-motion: reduce) {
      .reveal.spinning .slot-name { filter: none; }
      .reveal.revealed { animation: none; }
    }
  </style>

  <script>
    // ---- page chrome: menu works regardless of any later failures (no imports) ----
    (function () {
      var menuButton = document.querySelector('.menu-button');
      var menu = document.querySelector('.menu-panel');
      var scrim = document.querySelector('.scrim');
      if (!menuButton || !menu || !scrim) return;
      function setMenu(open) {
        menuButton.setAttribute('aria-expanded', String(open));
        menuButton.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
        menu.dataset.open = String(open);
        scrim.dataset.open = String(open);
        scrim.tabIndex = open ? 0 : -1;
        document.body.style.overflow = open ? 'hidden' : '';
      }
      window.__cumzSetMenu = setMenu;
      menuButton.addEventListener('click', function () {
        setMenu(menuButton.getAttribute('aria-expanded') !== 'true');
      });
      scrim.addEventListener('click', function () { setMenu(false); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setMenu(false);
      });
    })();
  </script>
  <script type="module">
    // web3 comes from the vendored IIFE via /cumzillaraptors/mint/chain.js (web3-shim)
    import {
      Connection, PublicKey, Transaction,
      fetchLaunchState, fetchAllocatedIds, getConfigPda, getAllocationPda,
      getAssetPda, buildMintInstruction, fetchRaptorImageUrl,
      confirmSignatureFast,
    } from "/cumzillaraptors/mint/chain.js";
    import { createWalletConnector, isMobileWalletBrowser } from "/cumzillaraptors/mint/wallet.js";

    const cfg = window.CUMZ_CONFIG;
    if (cfg.network !== "devnet") throw new Error("this build targets devnet only");
    const PROGRAM_ID = new PublicKey(cfg.programId);
    const MPL_CORE = new PublicKey(cfg.mplCoreProgramId);
    const TREASURY = new PublicKey(cfg.treasury);

    const $ = (id) => document.getElementById(id);
    // Explicit wsEndpoint: web3.js otherwise derives it silently, and a broken
    // socket degrades confirmTransaction() into a ~60-90s blockheight wait.
    // cfg.wsUrl lets config override it; default mirrors the http endpoint.
    const WS_URL = cfg.wsUrl || cfg.rpcUrl.replace(/^http/, 'ws');
    const conn = new Connection(cfg.rpcUrl, { commitment: "confirmed", wsEndpoint: WS_URL });

    let provider = null, walletPubkey = null, launch = null;
    let poolOrder = null, metaCache = null, spinning = false;
    const desktopFastPath = !isMobileWalletBrowser();
    let preparedDesktopMint = null;
    let desktopPrepareInFlight = null;
    let desktopRefreshTimer = null;
    let desktopPrepareGeneration = 0;
    let pageActive = true;
    const DESKTOP_PREPARE_MAX_AGE_MS = 15_000;
    // Every signature this page has handed to the wallet for the CURRENT roll.
    // A blockhash-expiry retry re-opens the wallet, and the earlier request is
    // still approvable — so before retrying we check these for an on-chain
    // landing. Without this a slow user could approve twice and pay 2 SOL.
    let pendingSignatures = [];

    // The serialized signed transaction for the CURRENT roll. Kept so the page can
    // rebroadcast the SAME bytes while waiting for confirmation. Resending an
    // identical signed transaction is idempotent — the network dedupes by
    // signature — so this can never double-charge.
    let signedRawTx = null;

    const short = (s) => s.length > 18 ? s.slice(0, 6) + '…' + s.slice(-4) : s;
    function setMsg(text, cls) { const el = $('mint-msg'); el.textContent = text || ''; el.className = 'msg' + (cls ? ' ' + cls : ''); }

    // ---- status + progress ----
    async function refreshStatus() {
      if (!pageActive) return;
      // Never run while a roll is in flight: this poll used to overwrite the
      // "approve the 1 SOL payment" message the user was actively acting on,
      // and could flip the Roll button's disabled state mid-approval.
      if (spinning) return;
      try {
        launch = await fetchLaunchState(cfg.rpcUrl, cfg.programId);
        if (!pageActive) return;
        if (!launch) throw new Error('not initialized');
        updateProgress(launch.publicMinted, cfg.publicCount);
        // Keep the allocation cache warm so a roll does not pay for this read.
        if (walletPubkey) warmAllocated();
        if (walletPubkey) prepareDesktopMint();
      } catch (e) {
        if (spinning) return;
        setMsg('devnet status unavailable — launch setup may be incomplete.', 'err');
      }
      updateButtons();
    }
    function updateProgress(minted, total) {
      $('prog-minted').textContent = minted;
      $('prog-fill').style.width = Math.min(100, (minted / total) * 100).toFixed(1) + '%';
    }

    function updateButtons() {
      if (!pageActive) return;
      const ready = !!(wc.publicKey && launch && launch.isLive &&
                        launch.publicMinted < cfg.publicCount && !spinning &&
                        (!desktopFastPath || preparedDesktopMint));
      $('btn-mint').setAttribute('aria-disabled', String(!ready));
    }

    // ---- wallet (shared connector: phantom/solflare/backpack/glow/exodus + wallet-standard) ----
    const wc = createWalletConnector({
      rpcUrl: cfg.rpcUrl,
      onConnect: (pk) => {
        walletPubkey = pk;
        $('btn-connect').textContent = 'connected · ' + short(pk.toBase58());
        // Warm the pool + metadata caches now so the first roll does not spend
        // ~450ms of its approval window fetching 330KB inside the click handler.
        prefetchMintData();
        prepareDesktopMint();
        updateButtons();
      },
      onDisconnect: () => {
        walletPubkey = null;
        clearPreparedDesktopMint();
        $('btn-connect').textContent = 'connect wallet';
        updateButtons();
      },
      onAccountChange: (pk) => {
        walletPubkey = pk;
        clearPreparedDesktopMint();
        $('btn-connect').textContent = 'connected · ' + short(pk.toBase58());
        prepareDesktopMint();
        updateButtons();
      },
    });
    $('btn-connect').addEventListener('click', async () => {
      setMsg('');
      try {
        const res = await wc.connect();
        if (res.reused) setMsg('reconnected to previous session.', 'ok');
      } catch (e) {
        setMsg(e.message, 'err');
      }
    });

    // ---- data ----
    async function loadPool() {
      if (!poolOrder) {
        poolOrder = await (await fetch('/cumzillaraptors/mint/data/pool-order.json')).json();
        if (!Array.isArray(poolOrder) || poolOrder.length !== cfg.publicCount) throw new Error('pool order file failed validation');
      }
      return poolOrder;
    }
    async function loadMeta() {
      if (!metaCache) metaCache = await (await fetch('/cumzillaraptors/mint/data/metadata-slim.json')).json();
      return metaCache;
    }

    // Warm both caches in the background. Failures are ignored: the click path
    // still fetches on demand, so a cold prefetch never blocks a roll.
    function prefetchMintData() {
      loadPool().catch(() => {});
      loadMeta().catch(() => {});
      warmAllocated();
    }

    // PERCEIVED SPEED (desktop): the allocation registry is a ~586-byte account
    // that only changes when someone mints. Fetching it inside the click handler
    // put a full RPC round trip in front of the wallet popup. Warm it on connect
    // and refresh it on the status poll, so a roll can usually start instantly.
    //
    // It is only ever a CACHE: rollNftId still awaits a fresh read when the warm
    // copy is missing or stale, because minting an already-allocated id fails.
    let allocatedCache = null;        // { ids:Set, at:number }
    let allocatedInFlight = null;
    const ALLOCATED_TTL_MS = 15_000;

    function warmAllocated() {
      if (allocatedInFlight) return allocatedInFlight;
      allocatedInFlight = fetchAllocatedIds(cfg.rpcUrl, cfg.programId)
        .then((ids) => { allocatedCache = { ids, at: Date.now() }; return ids; })
        .catch(() => null)
        .finally(() => { allocatedInFlight = null; });
      return allocatedInFlight;
    }

    async function getAllocatedFresh() {
      if (allocatedCache && Date.now() - allocatedCache.at < ALLOCATED_TTL_MS) {
        return allocatedCache.ids;
      }
      return (await warmAllocated()) || await fetchAllocatedIds(cfg.rpcUrl, cfg.programId);
    }

    // pick a RANDOM unallocated public id (lottery, not lowest-first)
    async function rollNftId() {
      // PERCEIVED SPEED: the pool order (static file) and the allocation registry
      // (RPC) are independent, so fetch them concurrently. Serially these were two
      // round trips stacked in front of the wallet popup.
      const [order, allocated] = await Promise.all([
        loadPool(),
        getAllocatedFresh(),
      ]);
      const available = order.filter((id) => !allocated.has(id));
      if (!available.length) throw new Error('the pool is empty — all raptors minted!');
      return available[Math.floor(Math.random() * available.length)];
    }

    // DESKTOP FAST PATH. Prepare the complete transaction BEFORE the user clicks
    // Roll. A ready Roll therefore has no fetch, RPC, simulation, blockhash read,
    // or instruction build between the click and Phantom's native popup.
    function clearPreparedDesktopMint() {
      desktopPrepareGeneration++;
      preparedDesktopMint = null;
      desktopPrepareInFlight = null;
      if (desktopRefreshTimer) clearTimeout(desktopRefreshTimer);
      desktopRefreshTimer = null;
    }
    window.addEventListener('beforeunload', () => {
      pageActive = false;
      clearPreparedDesktopMint();
    });

    function scheduleDesktopRefresh() {
      if (!desktopFastPath || !walletPubkey) return;
      if (desktopRefreshTimer) clearTimeout(desktopRefreshTimer);
      desktopRefreshTimer = setTimeout(() => {
        desktopRefreshTimer = null;
        // Disable Roll while replacing the prepared transaction. This prevents a
        // click from consuming the old blockhash during the atomic refresh.
        preparedDesktopMint = null;
        updateButtons();
        prepareDesktopMint({ force: true });
      }, 5_000);
    }

    function prepareDesktopMint({ force = false } = {}) {
      if (!pageActive || !desktopFastPath || !walletPubkey || !launch?.isLive || spinning) return null;
      if (!force && preparedDesktopMint &&
          Date.now() - preparedDesktopMint.preparedAt < DESKTOP_PREPARE_MAX_AGE_MS) {
        scheduleDesktopRefresh();
        return Promise.resolve(preparedDesktopMint);
      }
      if (desktopPrepareInFlight) return desktopPrepareInFlight;
      const generation = desktopPrepareGeneration;
      const preparingFor = walletPubkey.toBase58();
      desktopPrepareInFlight = (async () => {
        const nftId = await rollNftId();
        const metaAll = await loadMeta();
        const meta = metaAll[String(nftId)];
        if (!meta?.u || !Array.isArray(meta.p)) throw new Error('metadata proof missing for #' + nftId);
        const name = 'cumzillaraptor #' + nftId;
        const ix = await buildMintInstruction({
          programId: PROGRAM_ID,
          configPda: getConfigPda(PROGRAM_ID),
          registryPda: getAllocationPda(PROGRAM_ID),
          buyer: walletPubkey,
          treasury: TREASURY,
          collection: new PublicKey(launch.collection),
          assetPda: getAssetPda(PROGRAM_ID, nftId),
          mplCore: MPL_CORE,
          nftId, name, uri: meta.u, metadataProof: meta.p,
        });
        const tx = new Transaction().add(ix);
        tx.feePayer = walletPubkey;
        const [sim, blockhashInfo] = await Promise.all([
          conn.simulateTransaction(tx),
          conn.getLatestBlockhash('confirmed'),
        ]);
        if (sim.value.err) throw new Error('simulation failed: ' + JSON.stringify(sim.value.err));
        tx.recentBlockhash = blockhashInfo.blockhash;
        // Account may have changed while asynchronous preparation was running.
        if (generation !== desktopPrepareGeneration || !walletPubkey ||
            walletPubkey.toBase58() !== preparingFor || spinning) return null;
        preparedDesktopMint = {
          nftId, meta, name, tx, blockhashInfo, preparedAt: Date.now(),
        };
        updateButtons();
        scheduleDesktopRefresh();
        return preparedDesktopMint;
      })().catch((err) => {
        if (generation !== desktopPrepareGeneration) return null;
        console.error('[mint] desktop preparation failed:', err);
        scheduleDesktopRefresh();
        return null;
      }).finally(() => {
        if (generation === desktopPrepareGeneration) desktopPrepareInFlight = null;
      });
      return desktopPrepareInFlight;
    }

    // ---- raptor portrait (raw arweave png, unfiltered) ----

    // ---- slot machine spin ----
    function spinReveal(finalId, meta) {
      // Spins random ids INDEFINITELY until .settle() — called only AFTER the wallet has
      // approved the 1 SOL payment. The result is never shown before acceptance.
      let resolveSettled;
      const settled = new Promise((r) => { resolveSettled = r; });
      const box = $('reveal-box'), nameEl = $('slot-name'), traitsEl = $('slot-traits');
      box.classList.remove('revealed');
      box.classList.add('spinning');
      traitsEl.innerHTML = '';
      $('raptor-stage').hidden = true;
      const rollToken = (window.__cumzRollToken = (window.__cumzRollToken || 0) + 1);

      function showFinal() {
        box.classList.remove('spinning');
        box.classList.add('revealed');
        nameEl.textContent = meta.name || ('cumzillaraptor #' + finalId);

        const stage = $('raptor-stage'), img = $('raptor-img');
        stage.hidden = false;
        // raw png from arweave, unfiltered; mascot only as fallback
        const myRoll = window.__cumzRollToken;
        // keep the slot truly blank: no src, no alt, hidden until the png is fully decoded
        img.removeAttribute('src');
        img.alt = '';
        img.style.visibility = 'hidden';
        img.onload = () => { if (window.__cumzRollToken === myRoll && img.src) img.style.visibility = 'visible'; };
        fetchRaptorImageUrl(meta.u).then((url) => {
          if (url && window.__cumzRollToken === myRoll) img.src = url;
        });

        traitsEl.innerHTML = '';
        for (const [type, value] of (meta.t || [])) {
          const chip = document.createElement('span');
          chip.className = 'trait-chip';
          const b = document.createElement('b'); b.textContent = type + ': ';
          chip.append(b, document.createTextNode(value));
          traitsEl.append(chip);
        }
        resolveSettled();
      }

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        // no animation: hold "rolling…" text until approval, then reveal instantly
        nameEl.textContent = 'waiting for approval…';
      } else {
        const timer = setInterval(() => {
          const fakeId = 1 + Math.floor(Math.random() * (cfg.publicCount + cfg.claimCount));
          nameEl.textContent = 'cumzillaraptor #' + String(fakeId).padStart(3, '0');
        }, 70);
        settled.then(() => clearInterval(timer));
      }

      return { settled, settle: showFinal };
    }

    // ---- confetti (self-contained, no deps) ----
    function fireConfetti() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const canvas = $('confetti');
      const ctx = canvas.getContext('2d');
      canvas.width = innerWidth * devicePixelRatio;
      canvas.height = innerHeight * devicePixelRatio;
      ctx.scale(devicePixelRatio, devicePixelRatio);
      const W = innerWidth, H = innerHeight;
      const colors = ['#6dfe41', '#baffa0', '#f4f6ef', '#3ecf1e', '#eaffde'];
      const pieces = Array.from({ length: 160 }, () => ({
        x: Math.random() * W,
        y: -20 - Math.random() * H * 0.4,
        w: 5 + Math.random() * 7,
        h: 8 + Math.random() * 10,
        vy: 2.2 + Math.random() * 3.4,
        vx: -1.2 + Math.random() * 2.4,
        rot: Math.random() * Math.PI * 2,
        vr: (-1 + Math.random() * 2) * 0.18,
        color: colors[(Math.random() * colors.length) | 0],
      }));
      const start = performance.now();
      const DURATION = 3800;
      (function frame(now) {
        const t = now - start;
        ctx.clearRect(0, 0, W, H);
        if (t > DURATION) return;
        const fade = t > DURATION - 700 ? (DURATION - t) / 700 : 1;
        ctx.globalAlpha = fade;
        for (const p of pieces) {
          p.x += p.vx; p.y += p.vy; p.rot += p.vr;
          if (p.y > H + 30) { p.y = -20; p.x = Math.random() * W; }
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        }
        requestAnimationFrame(frame);
      })(start);
    }

    // ---- mint flow ----
    $('btn-mint').addEventListener('click', async () => {
      if ($('btn-mint').getAttribute('aria-disabled') === 'true') return;
      // Hard re-entry guard. aria-disabled alone is cosmetic: a double-click or
      // a stale unresolved payment must never start a second 1 SOL roll.
      if (spinning) return;
      if (pendingSignatures.length) {
        const landed = await findLandedSignature();
        if (landed) {
          setMsg('your previous roll already went through — reload the page to see it.', 'ok');
          return;
        }
        setMsg('a previous approval is still unresolved — reload the page before rolling again.', 'err');
        return;
      }
      setMsg('');
      spinning = true; updateButtons();
      pendingSignatures = [];
      signedRawTx = null;      // never rebroadcast a previous roll's transaction
      try {
        let nftId, meta, name, tx, result;
        if (desktopFastPath) {
          // Consume the atomically prepared transaction SYNCHRONOUSLY. There must
          // be no await before wc.signAndSend below: Chromium extensions may
          // throttle/defer popups that are no longer in the original click task.
          const prepared = preparedDesktopMint;
          preparedDesktopMint = null;
          if (!prepared || Date.now() - prepared.preparedAt > DESKTOP_PREPARE_MAX_AGE_MS) {
            throw new Error('mint preparation expired — please wait for Roll to become ready again.');
          }
          ({ nftId, meta, name, tx } = prepared);
          setMsg('approve the 1 SOL payment in your wallet…');
          const sig = await wc.signAndSend(tx, { preferSignOnly: false });
          pendingSignatures.push(sig);
          result = { sig, ...prepared.blockhashInfo };
        } else {
          // Keep the proven mobile path unchanged. Mobile in-app wallets work best
          // when the page signs then submits through its configured RPC.
          setMsg('rolling the drum…');
          nftId = await rollNftId();
          const metaAll = await loadMeta();
          meta = metaAll[String(nftId)];
          if (!meta?.u || !Array.isArray(meta.p)) throw new Error('metadata proof missing for #' + nftId);
          name = 'cumzillaraptor #' + nftId;
          const ix = await buildMintInstruction({
            programId: PROGRAM_ID,
            configPda: getConfigPda(PROGRAM_ID),
            registryPda: getAllocationPda(PROGRAM_ID),
            buyer: walletPubkey,
            treasury: TREASURY,
            collection: new PublicKey(launch.collection),
            assetPda: getAssetPda(PROGRAM_ID, nftId),
            mplCore: MPL_CORE,
            nftId, name, uri: meta.u, metadataProof: meta.p,
          });
          tx = new Transaction().add(ix);
          tx.feePayer = walletPubkey;
          setMsg('checking transaction…');
          const [sim, signingBlockhash] = await Promise.all([
            conn.simulateTransaction(tx),
            conn.getLatestBlockhash('confirmed'),
          ]);
          if (sim.value.err) throw new Error('simulation failed: ' + JSON.stringify(sim.value.err));
          setMsg('approve the 1 SOL payment in your wallet…');
          result = await sendWithRetry(tx, 3, signingBlockhash);
        }
        const sig = result.sig;

        // Animation starts only after Phantom returns a signature. This avoids a
        // misleading carousel while the extension is awaiting user approval.
        const spin = spinReveal(nftId, meta);

        // PERCEIVED SPEED: reveal as soon as the transaction is *processed*
        // (~400ms) rather than waiting for full 'confirmed'. Previously the
        // reveal was gated on confirmTransaction(), which — with a dead RPC
        // WebSocket — only settled when the blockhash expired, so the user sat
        // on "confirming on-chain…" for 60-90s after already paying.
        //
        // This is safe: the money already left at approval, the reveal shows the
        // id the tx was BUILT for (not chain-derived), and a genuine on-chain
        // failure is still surfaced below by the full confirmation.
        if (!result.landedEarly) {
          setMsg('payment accepted — landing your raptor…');
          // Rebroadcast the same signed bytes on a slow tick while we poll. A
          // single blind send can be dropped by the network; without this the
          // user waits out the whole blockhash and sees a bogus "timed out".
          const stopRebroadcast = startRebroadcast();
          let early;
          try {
            early = await confirmSignatureFast(conn, sig, {
              commitment: 'processed',
              blockhashInfo: {
                blockhash: result.blockhash,
                lastValidBlockHeight: result.lastValidBlockHeight,
              },
              timeoutMs: 30_000,
            });
          } finally {
            stopRebroadcast();
          }
          if (early.status === 'timeout') {
            // Nothing seen yet — fall through to the strict confirm below rather
            // than revealing something that might never land.
            setMsg('payment accepted — confirming on-chain…');
            await confirmMint(sig, {
              blockhash: result.blockhash,
              lastValidBlockHeight: result.lastValidBlockHeight,
            });
          }
        }

        spin.settle();                     // reveal now — no full-confirm wait
        await spin.settled;
        setMsg('');
        fireConfetti();
        const link = document.createElement('a');
        link.className = 'explorer';
        link.href = 'https://explorer.solana.com/tx/' + sig + '?cluster=devnet';
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'view transaction ↗';
        setMsg('🎉 you rolled ' + name + '! ', 'ok');
        $('mint-msg').append(link);

        // Reconcile in the background: the raptor is already on screen, but if
        // the tx ultimately failed the user must be told rather than left with a
        // reveal for a mint that never landed.
        if (!result.landedEarly) {
          confirmSignatureFast(conn, sig, { commitment: 'confirmed' })
            .then(() => { pendingSignatures = []; refreshStatus(); })
            .catch((err) => {
              console.error('[mint] post-reveal confirmation failed:', err);
              setMsg('⚠️ this roll did not confirm on-chain: ' + prettyError(err) +
                ' — check the transaction before rolling again.', 'err');
              $('mint-msg').append(link);
            });
        } else {
          pendingSignatures = [];   // roll fully resolved — allow another
          refreshStatus();
        }
      } catch (e) {
        // reset the slot box if we never revealed
        const box = $('reveal-box');
        box.classList.remove('spinning', 'revealed');
        $('slot-name').textContent = 'roll to reveal 🎲';
        $('slot-traits').innerHTML = '';
        $('raptor-stage').hidden = true;
        // Only clear the pending set when we KNOW no payment can still land.
        // A rejected/never-signed attempt is safe to clear; an expiry-related
        // failure leaves signatures that might yet confirm, so we keep them and
        // the re-entry guard forces a reload.
        if (!pendingSignatures.length || isUserRejection(e)) pendingSignatures = [];
        setMsg(prettyError(e), 'err');
      } finally {
        spinning = false;
        updateButtons();
        // Desktop Roll stays disabled until the NEXT complete transaction is
        // ready. Preparation happens now, never after the next click.
        prepareDesktopMint({ force: true });
      }
    });

    function isUserRejection(e) {
      const msg = e?.message || String(e);
      return /cancelled by user|UserRejected|user rejected|rejected|denied/i.test(msg);
    }

    // A devnet blockhash stays valid for ~60-90s (150 blocks). If the user takes
    // too long in the wallet, submission fails with "block height exceeded".
    //
    // MONEY SAFETY: the previous version re-opened the wallet on expiry without
    // checking the earlier request. That request stays approvable, so a slow user
    // could approve two prompts and pay 2 SOL for one roll. Now, before any
    // retry, every signature already produced for this roll is checked on-chain;
    // if one landed we return it instead of asking for another payment.
    async function sendWithRetry(tx, maxAttempts = 3, prefetchedBlockhash = null) {
      let lastErr;
      let pending = prefetchedBlockhash;
      for (let attempt = 1; attempt <= maxAttempts; attempt++) {
        try {
          // Use the blockhash fetched in parallel with simulation on the first
          // attempt so the popup opens immediately. Any RETRY must fetch a fresh
          // one — reusing the expired hash is what caused the failure.
          const { blockhash, lastValidBlockHeight } =
            pending || await conn.getLatestBlockhash('confirmed');
          pending = null;
          tx.recentBlockhash = blockhash;
          tx.signatures = [];                 // stale partial signatures invalidate the tx
          // Fresh countdown for THIS attempt's blockhash.
          const stopCountdown = startApprovalCountdown();
          let sig;
          try {
            // MONEY SAFETY: record the signature the moment the wallet produces
            // it, BEFORE the page submits. If submission then fails, the signed
            // transaction may still land, and findLandedSignature() must be able
            // to find it rather than us opening a second paid approval.
            sig = await wc.signAndSend(tx, {
              // CORRECTNESS over ~150ms. Verified against live devnet: with
              // skipPreflight:true the RPC silently ACCEPTS a transaction whose
              // blockhash has already expired and returns a signature, so the
              // page then polls a signature that can NEVER land and reports a
              // timeout. Preflight turns that into an immediate, actionable error.
              skipPreflight: false,
              onSigned: (s, raw) => {
                if (s && !pendingSignatures.includes(s)) pendingSignatures.push(s);
                // keep the signed bytes so we can REBROADCAST while confirming
                if (raw) signedRawTx = raw;
              },
            });
          } finally {
            stopCountdown();
          }
          if (!pendingSignatures.includes(sig)) pendingSignatures.push(sig);
          return { sig, blockhash, lastValidBlockHeight };
        } catch (e) {
          lastErr = e;
          // ORDER MATTERS. An EXPIRED blockhash means the signed transaction is
          // permanently dead: it can never land, so there is nothing to reconcile
          // or rebroadcast, and the only recovery is a fresh blockhash + a new
          // signature. Check this FIRST — routing it into the
          // "signed but undelivered" branch below dead-ends the roll with a scary
          // "do NOT approve again" even though nothing was ever charged.
          if (isBlockhashExpired(e)) {
            // MONEY SAFETY FIRST: a preflight "Blockhash not found" means the
            // transaction was never forwarded, so it cannot land. But we must not
            // rely on that inference to discard a signature the user already
            // approved — if anything DID land we must return it instead of
            // re-prompting. The check is free when no signature exists yet.
            const landed = await findLandedSignature();
            if (landed) return landed;
            // Nothing landed and the bytes are permanently dead: they can never
            // confirm, so they must not be rebroadcast or reported as pending.
            signedRawTx = null;
            pendingSignatures = [];
            if (attempt === maxAttempts) throw e;
            setMsg('the approval window expired before the network accepted it — ' +
                   'no payment was taken. opening your wallet again; please approve promptly.');
            continue;
          }
          // A SIGNED transaction whose submission failed for any OTHER reason may
          // still land: it can already have reached a node, and we keep
          // rebroadcasting it. Never report a bare submission error in that state
          // — reconcile first, and if nothing landed, recover by retrying delivery
          // rather than asking for a second paid approval.
          if (pendingSignatures.length && signedRawTx) {
            const landed = await findLandedSignature();
            if (landed) return landed;
            const rescued = await retryDelivery(pendingSignatures[pendingSignatures.length - 1]);
            if (rescued) return rescued;
            throw new Error(
              'your approval went through but the transaction could not be delivered. ' +
              'do NOT approve again — check your wallet history, then reload the page.');
          }
          if (attempt === maxAttempts) throw e;
        }
      }
      throw lastErr;
    }

    // Live countdown while the wallet popup is open. A devnet blockhash is valid
    // ~60s and that clock starts before the popup appears, so users who take
    // their time lose the signature with no warning. Counting down converts an
    // invisible deadline into a visible one.
    function startApprovalCountdown(seconds = 55) {
      let left = seconds;
      const base = 'approve the 1 SOL payment in your wallet';
      const render = () => setMsg(left > 0
        ? base + '… (~' + left + 's before the approval window expires)'
        : base + '… (window expired — a fresh approval will be requested)');
      render();
      let timer = setTimeout(function tick() {
        left -= 1;
        render();
        if (left > 0) timer = setTimeout(tick, 1000);
      }, 1000);
      return () => clearTimeout(timer);
    }

    // Recover a signed-but-undelivered transaction by resending the SAME bytes
    // and watching for it to land. Idempotent (the cluster dedupes by signature),
    // so this can never charge the user twice. Returns a landed result or null.
    async function retryDelivery(sig, attempts = 4, intervalMs = 1500) {
      if (!signedRawTx || !sig) return null;
      setMsg('payment accepted — retrying delivery to the network…');
      for (let i = 0; i < attempts; i++) {
        try {
          await conn.sendRawTransaction(signedRawTx, { skipPreflight: true, maxRetries: 5 });
        } catch (e) {
          // "already processed" means it landed; anything else is transient.
        }
        const landed = await findLandedSignature();
        if (landed) return landed;
        await new Promise((r) => setTimeout(r, intervalMs));
      }
      return null;
    }

    // Rebroadcast the current roll's signed transaction every 2s until stopped.
    // Idempotent by design: the cluster dedupes by signature, so resending the
    // identical signed bytes cannot produce a second payment. This replaces the
    // rebroadcast duty the WALLET used to perform when it owned submission.
    function startRebroadcast(intervalMs = 2000) {
      if (!signedRawTx) return () => {};
      let stopped = false;
      const tick = async () => {
        if (stopped || !signedRawTx) return;
        try {
          await conn.sendRawTransaction(signedRawTx, {
            skipPreflight: true, maxRetries: 5,
          });
        } catch (e) {
          // "already processed" means it LANDED — nothing to do; the poll wins.
          // Any other error is transient; keep trying until stopped.
        }
        if (!stopped) timer = setTimeout(tick, intervalMs);
      };
      let timer = setTimeout(tick, intervalMs);
      return () => { stopped = true; clearTimeout(timer); };
    }

    // Check every signature produced for the current roll. Returns the first one
    // that is confirmed/finalized without error, or null if none landed.
    async function findLandedSignature() {
      if (!pendingSignatures.length) return null;
      let statuses;
      try {
        statuses = (await conn.getSignatureStatuses(pendingSignatures, {
          searchTransactionHistory: true,
        })).value;
      } catch (e) {
        // Cannot prove nothing landed — refuse to re-prompt rather than risk
        // charging the user a second SOL.
        throw new Error(
          'could not verify whether your previous approval went through. ' +
          'check your wallet history before rolling again.',
        );
      }
      for (let i = 0; i < statuses.length; i++) {
        const s = statuses[i];
        if (!s || s.err) continue;
        if (s.confirmationStatus === 'confirmed' || s.confirmationStatus === 'finalized') {
          return { sig: pendingSignatures[i], landedEarly: true };
        }
      }
      return null;
    }

    async function confirmMint(sig, blockhashInfo) {
      try {
        const conf = await conn.confirmTransaction({ signature: sig, ...blockhashInfo }, 'confirmed');
        if (conf.value.err) throw new Error('on-chain error: ' + JSON.stringify(conf.value.err));
      } catch (e) {
        // A wallet/RPC timeout is not proof of failure. The transaction can already be
        // confirmed, so check its signature before telling the user to retry and risk
        // buying a second raptor.
        const status = (await conn.getSignatureStatuses([sig], {
          searchTransactionHistory: true,
        })).value[0];
        if (status?.err) throw new Error('on-chain error: ' + JSON.stringify(status.err));
        if (status?.confirmationStatus === 'confirmed' || status?.confirmationStatus === 'finalized') return;
        throw e;
      }
    }

    function isBlockhashExpired(e) {
      const msg = e?.message || String(e);
      return /blockhash|block height|blockheight/i.test(msg);
    }

    function prettyError(e) {
      const msg = e?.message || String(e);
      if (/cancelled by user/i.test(msg)) return 'cancelled.';
      if (/UserRejected|rejected/i.test(msg)) return 'you rejected the transaction.';
      if (/insufficient|Insufficient/i.test(msg)) return 'not enough SOL in your wallet (need 1 SOL + fees).';
      if (/pool is empty/i.test(msg)) return msg;
      // A blockhash/blockheight failure means the transaction was never
      // DELIVERED — it says nothing about which cluster the wallet is on. The
      // old copy blamed the network setting, which sent users hunting a
      // non-existent misconfiguration (reported 2026-08-30 with devnet correctly
      // selected). Report what actually happened and what to do about it.
      if (/blockhash|block height|blockheight|not confirmed in/i.test(msg))
        return 'the network did not pick up your transaction in time. it was not confirmed, ' +
               'so no raptor was minted — reload the page before rolling again, and check ' +
               'your wallet history first if you were asked to approve.';
      return msg;
    }

    refreshStatus();
    setInterval(refreshStatus, 30000);
  </script>
</body>
