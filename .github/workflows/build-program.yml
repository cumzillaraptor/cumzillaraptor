name: Build Solana Program

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-sbpf:
    name: Build SBPF program
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI 1.18.26
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://release.anza.xyz/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            -o /tmp/solana.tar.bz2
          tar -xjf /tmp/solana.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/solana-release/bin:$PATH"
          solana --version
          cargo-build-sbf --version

      - name: Build program with SBPF platform tools v1.54
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          # cargo-build-sbf v1.18 panics if this fresh-runner cache root is absent.
          mkdir -p "$HOME/.cache/solana"
          test -d "$HOME/.cache/solana"
          # v1.54 parses edition2024 manifests; the program enables its documented
          # custom-panic feature to avoid the older default entrypoint panic macro.
          RUST_BACKTRACE=1 cargo-build-sbf \
            --manifest-path programs/cumzillaraptors/Cargo.toml \
            --tools-version v1.54 \
            --force-tools-install \
            --arch sbfv2 \
            --verbose

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          PROGRAM_SO=$(find . -path '*/target/deploy/cumzillaraptors.so' -type f -print -quit)
          test -n "$PROGRAM_SO"
          ls -lh "$PROGRAM_SO"
          sha256sum "$PROGRAM_SO"

      - name: Record exact SBPF source revision
        shell: bash
        run: |
          set -euo pipefail
          PROGRAM_SO=$(find . -path '*/target/deploy/cumzillaraptors.so' -type f -print -quit)
          test -n "$PROGRAM_SO"
          printf '%s\n' "$GITHUB_SHA" > "$(dirname "$PROGRAM_SO")/cumzillaraptors.build-revision"

      - name: Build isolated test-validation SBPF artifact for private localhost only
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          TEST_SBF_OUT_DIR="$GITHUB_WORKSPACE/.artifacts/test-validation-sbpf"
          mkdir -p "$TEST_SBF_OUT_DIR"
          RUST_BACKTRACE=1 cargo-build-sbf \
            --manifest-path programs/cumzillaraptors/Cargo.toml \
            --tools-version v1.54 \
            --arch sbfv2 \
            --features test-validation \
            --sbf-out-dir "$TEST_SBF_OUT_DIR" \
            --verbose
          test -f "$TEST_SBF_OUT_DIR/cumzillaraptors.so"
          # The ordinary production artifact remains target/deploy/cumzillaraptors.so. Only the
          # explicitly named copy below may be passed to the private loopback validator.
          install -m 0644 "$TEST_SBF_OUT_DIR/cumzillaraptors.so" "$TEST_SBF_OUT_DIR/cumzillaraptors.test-validation.so"
          printf '%s\n' "$GITHUB_SHA" > "$TEST_SBF_OUT_DIR/cumzillaraptors.build-revision"
          printf '%s\n' "$GITHUB_SHA" > "$TEST_SBF_OUT_DIR/cumzillaraptors.test-validation.build-revision"

      - name: Set up Node for local validation gates
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install locked local validation dependencies
        run: npm ci

      - name: Run Task 5 Bankrun initialization gate
        shell: bash
        env:
          CUMZ_EXPECTED_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          PROGRAM_DIR="$GITHUB_WORKSPACE/.artifacts/test-validation-sbpf"
          test -f "$PROGRAM_DIR/cumzillaraptors.build-revision"
          CUMZ_TEST_VALIDATION_AUTHORITY_KEYPAIR_JSON="$(node -e "const {Keypair}=require('@solana/web3.js'); process.stdout.write(JSON.stringify(Array.from(Keypair.generate().secretKey)))")" \
            SBF_OUT_DIR="$PROGRAM_DIR" node --test tests/bankrun-initialize.test.mjs

      - name: Run Task 7 Bankrun collection-creation gate
        shell: bash
        env:
          CUMZ_EXPECTED_BUILD_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          PROGRAM_DIR="$GITHUB_WORKSPACE/.artifacts/test-validation-sbpf"
          test -f "$PROGRAM_DIR/cumzillaraptors.build-revision"
          CUMZ_TEST_VALIDATION_AUTHORITY_KEYPAIR_JSON="$(node -e "const {Keypair}=require('@solana/web3.js'); process.stdout.write(JSON.stringify(Array.from(Keypair.generate().secretKey)))")" \
            SBF_OUT_DIR="$PROGRAM_DIR" node --test tests/bankrun-collection.test.mjs

      # This is a mandatory private localhost gate: the script executes the real
      # atomic secp→claim_nft path and its Metaplex Core CPI, not only a loader check.
      - name: Run mandatory x86 atomic Core-CPI claim gate
        shell: bash
        env:
          CUMZ_EXPECTED_BUILD_REVISION: ${{ github.sha }}
          CUMZ_TEST_VALIDATION_SBF_OUT_DIR: ${{ github.workspace }}/.artifacts/test-validation-sbpf
        run: |
          set -euo pipefail
          test -f "$CUMZ_TEST_VALIDATION_SBF_OUT_DIR/cumzillaraptors.test-validation.so"
          test -f "$CUMZ_TEST_VALIDATION_SBF_OUT_DIR/cumzillaraptors.test-validation.build-revision"
          # Preserve both normal output and failure diagnostics in the retained CI artifact.
          bash scripts/run-x86-core-claim-gate.sh 2>&1 | tee local-x86-atomic-core-claim.log

      - name: Upload mandatory x86 atomic Core-CPI claim log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: local-x86-atomic-core-claim-log
          path: local-x86-atomic-core-claim.log
          if-no-files-found: warn
          retention-days: 90

      - name: Upload test-validation SBPF artifact and revision marker
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-validation-sbpf-artifact-and-revision
          path: |
            .artifacts/test-validation-sbpf/cumzillaraptors.test-validation.so
            .artifacts/test-validation-sbpf/cumzillaraptors.test-validation.build-revision
          if-no-files-found: warn
          retention-days: 90

      - name: Upload program artifact
        uses: actions/upload-artifact@v4
        with:
          name: cumzillaraptors-devnet-sbpf
          path: |
            **/target/deploy/cumzillaraptors.so
            **/target/deploy/cumzillaraptors.build-revision
          if-no-files-found: error
          retention-days: 90
