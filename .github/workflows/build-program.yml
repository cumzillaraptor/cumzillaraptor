name: Build Solana Program

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          # Extract Solana release directly (installer script is broken on anza.xyz)
          curl -sSfL "https://release.anza.xyz/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o /tmp/solana.tar.bz2
          tar -xjf /tmp/solana.tar.bz2 -C /tmp/
          mkdir -p "$HOME/.local/share/solana/install/active_release/bin"
          cp /tmp/solana-release/bin/* "$HOME/.local/share/solana/install/active_release/bin/"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          solana --version
          solana-keygen --version

      - name: Install Anchor CLI
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.30.1
          avm use 0.30.1
          PATH="$HOME/.avm/tmp/bin:$PATH" anchor --version

      - name: Build Program
        run: |
          export PATH="$HOME/.avm/tmp/bin:$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          anchor build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cumzillaraptors-program
          path: |
            target/deploy/
            target/idl/
          retention-days: 90
