name: Build Solana Program

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Solana CLI
        run: |
          # Download and extract Solana release tarball
          curl -sSfL "https://release.anza.xyz/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2" -o /tmp/solana.tar.bz2
          echo "Downloaded $(stat -c%s /tmp/solana.tar.bz2) bytes"
          tar -xjf /tmp/solana.tar.bz2 -C /tmp/
          echo "Extracted to /tmp/solana-release/"
          ls /tmp/solana-release/
          echo "---"
          ls /tmp/solana-release/bin/
          # Set PATH globally
          echo "/tmp/solana-release/bin" >> $GITHUB_PATH
          echo "PATH=/tmp/solana-release/bin:$PATH" >> $GITHUB_ENV
          export PATH="/tmp/solana-release/bin:$PATH"
          /tmp/solana-release/bin/solana --version
          /tmp/solana-release/bin/solana-keygen --version

      - name: Install Anchor CLI
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"
          cargo install --git https://github.com/coral-xyz/anchor avm --locked
          avm install 0.30.1
          avm use 0.30.1
          PATH="$HOME/.avm/tmp/bin:$PATH" anchor --version

      - name: Verify compatible dependency lockfile
        run: |
          test "$(sed -n 's/^version = //p' programs/cumzillaraptors/Cargo.lock | head -1)" = "3"
          echo "Using committed Cargo.lock v3 (compatible with Solana v1.18's bundled Cargo)."

      - name: Build Program
        run: |
          export PATH="$HOME/.avm/tmp/bin:$HOME/.cargo/bin:/tmp/solana-release/bin:$PATH"
          anchor build -- --locked

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cumzillaraptors-program
          path: |
            target/deploy/
            target/idl/
          retention-days: 90
