name: Deploy Site to Cloudflare Pages

# Publishes the static site (homepage, mint, claim) to the existing
# Cloudflare Pages project on every push to main.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'config/site.js'
      - 'cumzillaraptors/mint/**'
      - 'cumzillaraptors/claim/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Assemble a clean publish directory containing only public site files.
      # Nothing from programs/, scripts/, nft-data/, tests/, docs/ ships to the CDN.
      - name: Assemble site bundle
        run: |
          set -euo pipefail
          mkdir -p dist/assets dist/config dist/mint dist/claim
          cp index.html dist/
          cp assets/cumz.css assets/cumzillaraptor116.svg assets/cumzillaraptor-transparent.png assets/Chewy-Regular.ttf dist/assets/
          cp config/site.js dist/config/
          # /mint/ and /claim/ placeholders until the fresh pages land (subdomains kept)
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><title>cumzillaraptors — mint</title></head><body style="background:#000;color:#6dfe41;font-family:sans-serif;text-align:center;padding-top:40vh"><h1>mint — coming soon</h1></body></html>' > dist/mint/index.html
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><title>cumzillaraptors — claim</title></head><body style="background:#000;color:#6dfe41;font-family:sans-serif;text-align:center;padding-top:40vh"><h1>claim — coming soon</h1></body></html>' > dist/claim/index.html

      - name: Deploy to Cloudflare Worker (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
