name: Deploy Site to Cloudflare Pages

# Publishes the static site (homepage, mint, claim) to the existing
# Cloudflare Pages project on every push to main.
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'config/site.js'
      - 'worker.js'
      - 'wrangler.toml'
      - 'cumzillaraptors/mint/**'
      - 'cumzillaraptors/claim/**'
      # Shared browser modules (wallet.js, chain.js, claim-nonce.js, …) are
      # copied into both page bundles by build-site-dist.js. Without this path
      # a client-only fix silently never deploys.
      - 'cumzillaraptors/client/**'
      - 'scripts/build-site-dist.js'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site bundle
        run: node scripts/build-site-dist.js

      - name: Deploy to Cloudflare Worker (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          # Worker secret — set once in the GitHub dashboard; never in the repo.
          secrets: |
            HELIUS_API_KEY
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
