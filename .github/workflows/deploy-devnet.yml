name: Deploy Program to Devnet

# Manual dispatch only. Signs with repository secrets inside the runner;
# key material is written to temp files and deleted before the job ends.
# Never echoes secret contents; prints public keys and tx signature only.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLUSTER: devnet
  PROGRAM_ID: AYE4iC2gp81H8jvMjk4EGxWP2sJFzuDptUwxqwTZYTMY
  EXPECTED_AUTHORITY: 71WBrLfntE4yjTxEuQ3EgGJKE8zzZUgeEm5tkLi5Jx2r
  EXPECTED_PAYER: 5EFxpuoUGpXr2fhAvHMeKceWaYS7yHyULeb4mfdfGps9

jobs:
  deploy-devnet:
    name: Build and deploy to Devnet
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Solana CLI 1.18.26
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://release.anza.xyz/v1.18.26/solana-release-x86_64-unknown-linux-gnu.tar.bz2" \
            -o /tmp/solana.tar.bz2
          tar -xjf /tmp/solana.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
          export PATH="/tmp/solana-release/bin:$PATH"
          solana --version
          cargo-build-sbf --version

      - name: Build program with SBPF platform tools v1.54
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          mkdir -p "$HOME/.cache/solana"
          test -d "$HOME/.cache/solana"
          RUST_BACKTRACE=1 cargo-build-sbf \
            --manifest-path programs/cumzillaraptors/Cargo.toml \
            --tools-version v1.54 \
            --force-tools-install \
            --arch sbfv2 \
            --verbose

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          PROGRAM_SO=$(find . -path '*/target/deploy/cumzillaraptors.so' -type f -print -quit)
          test -n "$PROGRAM_SO"
          ls -lh "$PROGRAM_SO"
          sha256sum "$PROGRAM_SO"

      - name: Materialize keypairs from secrets (never printed)
        shell: bash
        env:
          AUTHORITY_JSON: ${{ secrets.CUMZ_DEVNET_LAUNCH_AUTHORITY_KEYPAIR_JSON }}
          PAYER_JSON: ${{ secrets.CUMZ_DEVNET_PAYER_KEYPAIR_JSON }}
          PROGRAM_JSON: ${{ secrets.CUMZ_DEVNET_PROGRAM_KEYPAIR_JSON }}
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          umask 077
          printf '%s' "$AUTHORITY_JSON" > /tmp/authority.json
          printf '%s' "$PAYER_JSON" > /tmp/payer.json
          printf '%s' "$PROGRAM_JSON" > /tmp/program.json
          # Identity checks: fail closed if either secret derives to the wrong pubkey.
          ACTUAL_AUTHORITY=$(solana-keygen pubkey /tmp/authority.json)
          ACTUAL_PAYER=$(solana-keygen pubkey /tmp/payer.json)
          ACTUAL_PROGRAM=$(solana-keygen pubkey /tmp/program.json)
          echo "authority pubkey: $ACTUAL_AUTHORITY"
          echo "payer pubkey:     $ACTUAL_PAYER"
          test "$ACTUAL_AUTHORITY" = "$EXPECTED_AUTHORITY" || { echo "::error::authority secret mismatch"; exit 1; }
          test "$ACTUAL_PAYER" = "$EXPECTED_PAYER" || { echo "::error::payer secret mismatch"; exit 1; }
          test "$ACTUAL_PROGRAM" = "$PROGRAM_ID" || { echo "::error::program secret mismatch"; exit 1; }

      - name: Fund payer via devnet airdrop (runner IP, best effort)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          solana config set --url "$CLUSTER" >/dev/null
          for i in 1 2 3 4 5; do
            solana airdrop 5 "$(solana-keygen pubkey /tmp/payer.json)" || true
            sleep 5
          done
          solana balance /tmp/payer.json || true

      - name: Confirm Devnet balances
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          solana config set --url "$CLUSTER" >/dev/null
          solana balance /tmp/payer.json
          solana balance /tmp/authority.json
          BAL=$(solana balance /tmp/payer.json | cut -d' ' -f1)
          awk -v b="$BAL" 'BEGIN{exit !(b >= 4.1)}' || { echo "::error::payer balance below 4.1 SOL needed for deploy rent"; exit 1; }

      - name: Extend program-data if the new binary outgrew it
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          solana config set --url "$CLUSTER" >/dev/null
          PROGRAM_SO=$(find . -path '*/target/deploy/cumzillaraptors.so' -type f -print -quit)
          NEW_SIZE=$(stat -c%s "$PROGRAM_SO")
          # program-data space = binary + 37-byte header (bpf-upgradeable-loader)
          DATA_ACCOUNT=$(solana program show --url "$CLUSTER" "$PROGRAM_ID" | awk '/Program Data Address/ {print $4}')
          OLD_SPACE=$(solana account "$DATA_ACCOUNT" --output json | jq -r '.space')
          OLD_BIN=$((OLD_SPACE - 37))
          echo "on-chain binary bytes: $OLD_BIN; new binary bytes: $NEW_SIZE"
          if [ "$NEW_SIZE" -gt "$OLD_BIN" ]; then
            GROW=$(( NEW_SIZE - OLD_BIN + 131072 )) # +128 KiB slack for future growth
            echo "extending program-data by $GROW bytes"
            solana program extend "$PROGRAM_ID" "$GROW" \
              --url "$CLUSTER" \
              --keypair /tmp/payer.json \
              --upgrade-authority /tmp/authority.json
            solana program show --url "$CLUSTER" "$PROGRAM_ID"
          fi

      - name: Reclaim lamports from stranded deploy buffers
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          solana config set --url "$CLUSTER" >/dev/null
          # Failed deploy attempts leave intermediate buffers holding rent;
          # close them back into the payer. Never touches the live program.
          solana program close --buffers \
            --url "$CLUSTER" \
            --fee-payer /tmp/payer.json || true
          solana balance /tmp/payer.json

      - name: Deploy program (payer + upgrade authority from secrets)
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          PROGRAM_SO=$(find . -path '*/target/deploy/cumzillaraptors.so' -type f -print -quit)
          test -n "$PROGRAM_SO"
          solana program deploy "$PROGRAM_SO" \
            --url "$CLUSTER" \
            --keypair /tmp/payer.json \
            --upgrade-authority /tmp/authority.json \
            --program-id /tmp/program.json \
            --with-compute-unit-price 10000 \
            --max-sign-attempts 20 \
            --output json | tee /tmp/deploy-result.json || { echo "::error::deploy failed"; exit 1; }
          echo "deploy output recorded"

      - name: Verify deployed authority
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/tmp/solana-release/bin:$PATH"
          solana program show "$PROGRAM_ID" --url "$CLUSTER" --keypair /tmp/payer.json 2>/dev/null \
            || solana program show "$PROGRAM_ID" --url devnet 2>/dev/null \
            || echo "verify step skipped (no default signer)"

      - name: Shred keypair temp files
        if: ${{ always() }}
        shell: bash
        run: shred -u /tmp/authority.json /tmp/payer.json /tmp/program.json 2>/dev/null || rm -f /tmp/authority.json /tmp/payer.json /tmp/program.json
